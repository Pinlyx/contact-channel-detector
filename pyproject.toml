[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "contact-channel-detector"
version = "0.1.0"
description = "Detect which contact channels a website offers customers: WhatsApp, Telegram, live chat widgets, social profiles, e-mail and phone."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Pinlyx" }]
keywords = [
  "whatsapp", "live-chat", "contact", "website", "scraper", "social-links",
  "lead-generation", "chat-widget", "detector", "crm",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/Pinlyx/contact-channel-detector"
Repository = "https://github.com/Pinlyx/contact-channel-detector"
Issues = "https://github.com/Pinlyx/contact-channel-detector/issues"

[project.scripts]
contact-channels = "contactchannels.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
contactchannels = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
